<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Countdown Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050505;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
      /* Prevent pull-to-refresh on mobile */
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .glass-panel {
      background: rgba(20, 20, 25, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .hat-btn {
      transition: all 0.2s ease;
    }

    .hat-btn:hover {
      transform: scale(1.2) translateY(-5px);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Pulse animation for the central text */
    @keyframes subtlePulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.02);
      }

      100% {
        transform: scale(1);
      }
    }

    .animate-pulse-subtle {
      animation: subtlePulse 2s infinite ease-in-out;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* Let clicks pass through to canvas */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      pointer-events: auto;
      /* Enable clicks on the modal */
    }

    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body class="text-white">

  <!-- The Interactive Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay Layer -->
  <div id="ui-layer">

    <!-- Hat Selection Modal (Initial Screen) -->
    <div id="hat-modal" class="modal-content glass-panel p-8 rounded-3xl max-w-md w-11/12 text-center fade-in">
      <h1 class="text-4xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
        Countdown Nexus
      </h1>
      <p class="text-gray-300 mb-6 text-sm">
        Join the collective. Tap to fire energy at the core. Bring the number down to Zero.<br /><br />
        Pick your cursor's hat to enter:
      </p>

      <div class="grid grid-cols-4 gap-4 mb-6" id="hat-grid">
        <!-- Hats injected by JS -->
      </div>

      <p class="text-xs text-gray-500 mt-4">Multiplayer interactive experience</p>
    </div>

    <!-- Victory / Share Modal (Hidden initially) -->
    <div id="victory-modal"
      class="modal-content glass-panel p-8 rounded-3xl max-w-md w-11/12 text-center hidden flex-col items-center">
      <h2
        class="text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">
        ZERO REACHED
      </h2>
      <p class="text-lg text-gray-200 mb-8" id="victory-text">
        The core has been shattered. You and the community did it!
      </p>
      <button id="share-btn"
        class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        Share Victory
      </button>
    </div>

  </div>

  <!-- Application Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot, increment, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- FIREBASE SETUP ---
    // 🚨 Replace this with your actual Firebase config from the Firebase Console when deploying!

    const myFirebaseConfig = {
      apiKey: "AIzaSyBgBVXDZdYrv2rWh0FgPsRzWpVdphDeYsI",
      authDomain: "io2026.firebaseapp.com",
      projectId: "io2026",
      storageBucket: "io2026.firebasestorage.app",
      messagingSenderId: "885430189722",
      appId: "1:885430189722:web:ba45c205e0fe20975f2923",
      measurementId: "G-39ETYZWEGG"
    };

    // Uses the platform's config if testing here, otherwise falls back to your custom config for production
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'countdown-nexus-prod';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- GLOBAL STATE ---
    let user = null;
    let myUserId = null;
    let myHat = "🤠";
    let myColor = `hsl(${Math.random() * 360}, 100%, 60%)`;

    // Multiplayer Data
    const otherCursors = new Map(); // id -> {x, y, targetX, targetY, color, hat, lastUpdate}
    let globalClicks = 0;
    let currentNumber = 10;
    const CLICKS_PER_NUMBER = 100; // How many global hits to decrement the number

    // Local Game State
    let localClicksPending = 0; // Batched clicks to send to firestore
    let isGameActive = false;

    // Canvas & Entities
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    const particles = []; // Projectiles fired by users
    const sparks = [];    // Explosion sparks when hitting the center

    // My local cursor exact position
    let mouseX = 0.5;
    let mouseY = 0.8;
    let isTouching = false;

    // Core physics
    let coreScale = 1;
    let coreWobble = 0;

    // --- INITIALIZATION ---
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- UI LOGIC ---
    const hats = ["1️⃣", "3️⃣", "7️⃣", "🔟", "👑", "🤠", "🚀", "🔥", "🔮", "🍕", "👾", "✨"];
    const hatGrid = document.getElementById('hat-grid');
    const hatModal = document.getElementById('hat-modal');
    const victoryModal = document.getElementById('victory-modal');

    hats.forEach(hat => {
      const btn = document.createElement('button');
      btn.className = 'hat-btn text-3xl p-3 rounded-xl border border-gray-700 bg-gray-800 bg-opacity-50 cursor-pointer';
      btn.innerText = hat;
      btn.onclick = () => startGame(hat);
      hatGrid.appendChild(btn);
    });

    async function startGame(selectedHat) {
      myHat = selectedHat;
      hatModal.classList.add('hidden');
      isGameActive = true;

      // Initial cursor position spawn
      mouseX = 0.5;
      mouseY = 0.8;
      updateMyCursorToDb(true);
    }

    document.getElementById('share-btn').addEventListener('click', () => {
      const text = `I just helped destroy the Core at the Countdown Nexus while wearing my ${myHat} hat! 💥`;
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    });

    // --- AUTH & FIRESTORE LOGIC ---
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Auth error:", error);
      }
    };

    onAuthStateChanged(auth, (u) => {
      if (u) {
        user = u;
        myUserId = u.uid;
        setupFirestoreListeners();
      }
    });

    function setupFirestoreListeners() {
      if (!user) return;

      // Listen to game state (the giant number)
      const gameStateRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameState', 'core');

      // Ensure document exists initially
      setDoc(gameStateRef, { totalClicks: 0 }, { merge: true }).catch(console.error);

      onSnapshot(gameStateRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          globalClicks = data.totalClicks || 0;

          // Calculate current number (10 down to 0)
          const calculatedNumber = Math.max(0, 10 - Math.floor(globalClicks / CLICKS_PER_NUMBER));

          if (calculatedNumber !== currentNumber) {
            triggerNumberChange(calculatedNumber);
          }
          currentNumber = calculatedNumber;

          if (currentNumber === 0 && isGameActive) {
            endGame();
          }
        }
      }, (error) => console.error("GameState sync error:", error));

      // Listen to other cursors
      const cursorsRef = collection(db, 'artifacts', appId, 'public', 'data', 'cursors');
      onSnapshot(cursorsRef, (snapshot) => {
        snapshot.forEach(docSnap => {
          const id = docSnap.id;
          if (id === myUserId) return; // Ignore self

          const data = docSnap.data();
          const now = Date.now();

          // Filter out stale cursors (> 10 seconds inactive)
          if (now - data.lastActive > 10000) {
            otherCursors.delete(id);
            return;
          }

          if (otherCursors.has(id)) {
            // Update target for interpolation
            const cursor = otherCursors.get(id);
            cursor.targetX = data.x;
            cursor.targetY = data.y;
            cursor.hat = data.hat;
            cursor.color = data.color;
            cursor.lastUpdate = now;
          } else {
            // New cursor
            otherCursors.set(id, {
              x: data.x,
              y: data.y,
              targetX: data.x,
              targetY: data.y,
              hat: data.hat,
              color: data.color,
              lastUpdate: now
            });
          }
        });
      }, (error) => console.error("Cursor sync error:", error));
    }

    // --- MULTIPLAYER WRITE THROTTLING ---
    let lastCursorUpdate = 0;
    function updateMyCursorToDb(force = false) {
      if (!isGameActive || !user) return;
      const now = Date.now();
      // Throttle to max 5 updates per second (200ms)
      if (force || now - lastCursorUpdate > 200) {
        lastCursorUpdate = now;
        const myCursorRef = doc(db, 'artifacts', appId, 'public', 'data', 'cursors', myUserId);
        setDoc(myCursorRef, {
          x: mouseX,
          y: mouseY,
          hat: myHat,
          color: myColor,
          lastActive: now
        }).catch(e => console.error("Cursor update error", e));
      }
    }

    // Throttle clicks to batch update global count
    setInterval(() => {
      if (localClicksPending > 0 && user) {
        const clicksToSend = localClicksPending;
        localClicksPending = 0;

        const gameStateRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameState', 'core');
        updateDoc(gameStateRef, {
          totalClicks: increment(clicksToSend)
        }).catch(e => {
          console.error("Click update error", e);
          localClicksPending += clicksToSend; // retry later
        });
      }
    }, 500);

    // --- INPUT HANDLING ---
    function updateMousePos(clientX, clientY) {
      if (!isGameActive) return;
      mouseX = clientX / width;
      mouseY = clientY / height;
      updateMyCursorToDb();
    }

    function handleFire(clientX, clientY) {
      if (!isGameActive || currentNumber === 0) return;
      updateMousePos(clientX, clientY);

      // Create particle aimed at center
      particles.push({
        x: clientX,
        y: clientY,
        color: myColor,
        speed: 15 + Math.random() * 5,
        size: 4 + Math.random() * 3
      });

      localClicksPending++;

      // Local predictive effect
      coreScale = 1.05;
      coreWobble = 10;
    }

    window.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
    window.addEventListener('mousedown', (e) => handleFire(e.clientX, e.clientY));

    window.addEventListener('touchstart', (e) => {
      isTouching = true;
      handleFire(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchend', () => isTouching = false);

    // --- GAME EFFECTS ---
    function triggerNumberChange(newNum) {
      // Massive screen shake & particle explosion
      coreScale = 1.8;
      coreWobble = 50;

      // Create explosion sparks
      for (let i = 0; i < 50; i++) {
        sparks.push({
          x: width / 2,
          y: height / 2,
          vx: (Math.random() - 0.5) * 20,
          vy: (Math.random() - 0.5) * 20,
          life: 1.0,
          color: `hsl(${Math.random() * 360}, 100%, 60%)`
        });
      }
    }

    function endGame() {
      triggerNumberChange(0);
      setTimeout(() => {
        victoryModal.classList.remove('hidden');
        victoryModal.classList.add('fade-in');
      }, 1500);
    }

    // --- RENDER LOOP ---
    function drawCursor(ctx, cx, cy, color, hat, isMe) {
      ctx.save();
      ctx.translate(cx, cy);

      // Draw Cursor Pointer
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(16, 16);
      ctx.lineTo(5, 16);
      ctx.lineTo(0, 24);
      ctx.closePath();

      // Glow
      ctx.shadowBlur = 10;
      ctx.shadowColor = color;
      ctx.fillStyle = color;
      ctx.fill();

      ctx.strokeStyle = "white";
      ctx.lineWidth = 1;
      ctx.stroke();

      // Draw Hat
      ctx.shadowBlur = 0;
      ctx.font = "24px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText(hat, 8, -5);

      if (isMe) {
        ctx.font = "10px Arial";
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fillText("You", 8, 35);
      }

      ctx.restore();
    }

    function render() {
      // Dark trailing effect for light trails
      ctx.fillStyle = 'rgba(5, 5, 8, 0.25)';
      ctx.fillRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      // Physics recovery
      coreScale += (1 - coreScale) * 0.1;
      coreWobble *= 0.8;

      // Draw Sparks
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 0.02;

        ctx.beginPath();
        // Prevent negative radius due to floating point decay before removal
        ctx.arc(s.x, s.y, Math.max(0, 4 * s.life), 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();

        if (s.life <= 0) sparks.splice(i, 1);
      }

      // Draw Particles (Lasers)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        // Move towards center
        const dx = centerX - p.x;
        const dy = centerY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 40) { // Hit center
          coreWobble += 2;
          coreScale = 1.02;
          particles.splice(i, 1);

          // Small hit spark
          sparks.push({
            x: centerX + (Math.random() - 0.5) * 20,
            y: centerY + (Math.random() - 0.5) * 20,
            vx: -dx / dist * 5 + (Math.random() - 0.5) * 5,
            vy: -dy / dist * 5 + (Math.random() - 0.5) * 5,
            life: 0.5,
            color: p.color
          });
          continue;
        }

        p.x += (dx / dist) * p.speed;
        p.y += (dy / dist) * p.speed;

        // Draw trail
        ctx.beginPath();
        ctx.moveTo(p.x - (dx / dist) * 20, p.y - (dy / dist) * 20);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.lineCap = "round";
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;
        ctx.stroke();
        ctx.shadowBlur = 0; // reset
      }

      // Draw Central Number
      ctx.save();
      let wx = (Math.random() - 0.5) * coreWobble;
      let wy = (Math.random() - 0.5) * coreWobble;
      ctx.translate(centerX + wx, centerY + wy);
      ctx.scale(coreScale, coreScale);

      // Dynamic text styling
      const fontSize = Math.min(width, height) * 0.4;
      ctx.font = `900 ${fontSize}px 'Segoe UI', Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Neon Glow effect
      const ratioToNext = (globalClicks % CLICKS_PER_NUMBER) / CLICKS_PER_NUMBER;
      const baseHue = currentNumber === 0 ? Math.random() * 360 : 280 + ratioToNext * 80;

      ctx.shadowBlur = 40 + Math.sin(Date.now() / 200) * 20;
      ctx.shadowColor = `hsl(${baseHue}, 100%, 60%)`;

      // Fill Number
      const grad = ctx.createLinearGradient(0, -fontSize / 2, 0, fontSize / 2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, `hsl(${baseHue}, 100%, 80%)`);

      ctx.fillStyle = grad;
      ctx.fillText(currentNumber.toString(), 0, 0);

      // Core cracking visual (lines over the number)
      if (ratioToNext > 0.5 && currentNumber > 0) {
        ctx.strokeStyle = '#050505';
        ctx.lineWidth = 4 + (ratioToNext - 0.5) * 10;
        ctx.beginPath();
        ctx.moveTo(-fontSize / 3, -fontSize / 3);
        ctx.lineTo(fontSize / 4, fontSize / 4);
        ctx.stroke();

        if (ratioToNext > 0.8) {
          ctx.beginPath();
          ctx.moveTo(fontSize / 3, -fontSize / 4);
          ctx.lineTo(-fontSize / 4, fontSize / 3);
          ctx.stroke();
        }
      }

      ctx.restore();

      // Draw Progress Ring
      if (currentNumber > 0) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, Math.max(0, fontSize * 0.6), -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * ratioToNext));
        ctx.strokeStyle = `rgba(255, 255, 255, 0.2)`;
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // Draw Multiplayer Cursors
      const now = Date.now();
      for (const [id, cursor] of otherCursors.entries()) {
        // Remove cleanly if dead
        if (now - cursor.lastUpdate > 5000) {
          otherCursors.delete(id);
          continue;
        }

        // Linear Interpolation for smooth movement
        cursor.x += (cursor.targetX - cursor.x) * 0.2;
        cursor.y += (cursor.targetY - cursor.y) * 0.2;

        const absX = cursor.x * width;
        const absY = cursor.y * height;
        drawCursor(ctx, absX, absY, cursor.color, cursor.hat, false);
      }

      // Draw My Cursor (if active and mouse is on screen)
      if (isGameActive && !isTouching) { // hide custom cursor if touching screen
        const absX = mouseX * width;
        const absY = mouseY * height;
        drawCursor(ctx, absX, absY, myColor, myHat, true);
      }

      requestAnimationFrame(render);
    }

    // Start systems
    initAuth();
    requestAnimationFrame(render);

  </script>
</body>

</html>
